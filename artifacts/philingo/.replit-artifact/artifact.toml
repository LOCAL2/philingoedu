kind = "web"
previewPath = "/"
title = "Philingo — Study English, Live Philippines"
version = "1.0.0"
id = "artifacts/philingo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21610

[services.development]
run = "pnpm --filter @workspace/philingo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/philingo", "run", "build" ]
serve = "static"
publicDir = "artifacts/philingo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21610"
BASE_PATH = "/"
